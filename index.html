<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>ORION HORIZON | Space Rogue-lite RPG</title>
    <style>
        :root {
            --bg-deep: #05070f;
            --bg-panel: #0b1120;
            --bg-light: #1e293b;

            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --neon-green: #10b981;
            --neon-blue: #0ea5e9;
            --neon-orange: #f59e0b;
            --neon-red: #ef4444;

            --font-ui: 'Courier New', Courier, monospace;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 2px solid var(--neon-blue);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
            z-index: 10;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            letter-spacing: 2px;
        }

        header .controls button {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 5px 10px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 0.8rem;
            margin-left: 10px;
            transition: all 0.2s;
        }

        header .controls button:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 5px var(--neon-blue);
        }

        .main-container {
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 50px);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 260px 1fr;
                grid-template-rows: auto 1fr;
            }
            .right-panel {
                grid-column: 1 / -1;
                height: 200px !important;
            }
        }

        .panel {
            background-color: rgba(11, 17, 32, 0.85);
            border: 1px solid var(--border-neon);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .left-panel { border-right: 2px solid var(--border-neon); }
        .center-panel { 
            border-right: 2px solid var(--border-neon); 
            background-color: rgba(7, 11, 22, 0.9);
            display: flex;
            flex-direction: column;
        }
        .right-panel { background-color: rgba(7, 11, 22, 0.85); }

        .panel-header {
            background-color: rgba(30, 41, 59, 0.5);
            padding: 8px 12px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-neon);
            display: flex;
            justify-content: space-between;
        }

        .status-group {
            padding: 15px;
            border-bottom: 1px solid rgba(31, 41, 55, 0.4);
        }

        .status-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .bar-container {
            width: 100%;
            height: 12px;
            background-color: var(--bg-light);
            border: 1px solid #334155;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s ease;
        }

        .bar-hp { background-color: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
        .bar-shield { background-color: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }
        .bar-fuel { background-color: var(--neon-orange); box-shadow: 0 0 8px var(--neon-orange); }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
        }

        .stat-box {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 2px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 3px;
        }

        .cargo-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .cargo-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .log-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-msg {
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-system { color: var(--text-muted); }
        .msg-story { color: var(--text-main); }
        .msg-combat-player { color: var(--neon-blue); }
        .msg-combat-enemy { color: var(--neon-red); }
        .msg-reward { color: var(--neon-green); }
        .msg-warning { color: var(--neon-orange); }

        .action-area {
            background-color: rgba(15, 23, 42, 0.9);
            border-top: 2px solid var(--border-neon);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 160px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.action-btn {
            background-color: var(--bg-light);
            border: 1px solid #475569;
            color: var(--text-main);
            padding: 12px;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            border-radius: 3px;
            transition: all 0.2s;
        }

        button.action-btn:hover:not(:disabled) {
            background-color: rgba(14, 165, 233, 0.15);
            border-color: var(--neon-blue);
            color: #fff;
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.3);
        }

        button.action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: transparent;
        }

        button.action-btn.btn-danger:hover:not(:disabled) {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: var(--neon-red);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
        }

        .map-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            overflow-y: auto;
        }

        .map-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.03);
            position: relative;
            padding-bottom: 10px;
        }

        .map-node {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #1e293b;
            border: 2px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            z-index: 2;
        }

        .map-node:hover:not(:disabled) {
            transform: scale(1.15);
            box-shadow: 0 0 10px #fff;
        }

        .map-node.current {
            border-color: var(--neon-blue);
            background-color: rgba(14, 165, 233, 0.3);
            box-shadow: 0 0 12px var(--neon-blue);
            animation: pulse 2s infinite;
        }

        .map-node.visited {
            border-color: var(--text-muted);
            background-color: #0f172a;
            opacity: 0.6;
        }

        .map-node:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .map-node.boss-node {
            border-color: var(--neon-purple);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
            width: 55px;
            height: 55px;
        }

        .map-node.boss-node.current {
            box-shadow: 0 0 15px var(--neon-purple);

function generateSectorMap() {
let nodesLayers = [];

type: NODE_TYPES.BOSS, visited: false, marketPrices: generateMarketPrices(NODE_TYPES.BOSS), connections: []
};
nodesLayers.push([bossNode]);
// Связываем каждый узел текущего ряда со ВСЕМИ узлами следующего ряда

for (let n = 0; n < nodesLayers[r].length; n++) {
const nextRow = nodesLayers[r+1];
nextRow.forEach(nextNode => {
nodesLayers[r][n].connections.push(nextNode.id);
});
}
}
gameState.nodes = nodesLayers.flat();
// Игрок стартует в первом узле первого ряда
gameState.currentLocationIndex = gameState.nodes[0].id;
gameState.nodes[0].visited = true;
gameState.mode = 'navigation';
saveGame();
}
function generateMarketPrices(type) {
const modifiers = { fuel: 1, metal: 1, electronics: 1, meds: 1 };
if (type === NODE_TYPES.PLANET) { modifiers.metal = 0.6; modifiers.electronics = 1.3; }
if (type === NODE_TYPES.STATION) { modifiers.electronics = 0.7; modifiers.fuel = 0.8; modifiers.metal = 1.2; }
if (type === NODE_TYPES.ASTEROIDS) { modifiers.metal = 0.4; modifiers.meds = 1.4; }
const prices = {};
for (let key in BASE_PRICES) {
const randomFluctuation = 0.85 + Math.random() * 0.3;
prices[key] = Math.round(BASE_PRICES[key] * (modifiers[key] || 1) * randomFluctuation);
}
return prices;
}
